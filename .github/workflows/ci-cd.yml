name: CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  # Continuous Integration
  buildAndTest:
    name: Run tests and code quality
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the Git repository
        uses: actions/checkout@v4
      - name: Set up Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Make gradlew executable
        working-directory: ./apps/backend/
        run: chmod +x ./gradlew
      - name: Run unit tests and checkstyle linter
        working-directory: ./apps/backend/
        run: ./gradlew build

  security-analysis:
    name: Scorecard analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: "Upload artifact"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: Scorecard SARIF
          path: results.sarif
          retention-days: 5
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: scorecards

  backend-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        working-directory: ./apps/backend/
        run: chmod +x ./gradlew

      - name: Build and Analyze
        working-directory: apps/backend/
        run: ./gradlew check jacocoTestReport || true

      - name: Upload SpotBugs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/apps/backend/build/reports/spotbugs/main.sarif
          category: spotbugs-backend

      - name: "Upload SpotBugs SARIF artifact"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SpotBugs SARIF
          path: ${{ github.workspace }}/apps/backend/build/reports/spotbugs/main.sarif
          retention-days: 5

      - name: JaCoCo PR Report
        if: github.event_name == 'pull_request'
        uses: Madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/apps/backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          title: 'Backend Test Coverage'

  frontend-analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ${{ github.workspace }}/apps/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ github.workspace }}/apps/frontend
        run: |
          npm install --no-audit --no-fund --no-save @microsoft/eslint-formatter-sarif
          npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif || true
      - name: "Upload artifact"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ESLINT Sarif
          path: ${{ github.workspace }}/apps/frontend/eslint-results.sarif
          retention-days: 5
      - name: Upload ESLint SARIF
        uses: github/codeql-action/upload-sarif@9e907b5e64f6b83e7804b09294d44122997950d6
        with:
          sarif_file: ${{ github.workspace }}/apps/frontend/eslint-results.sarif
          category: eslint-frontend

  deploy-to-ec2:
    needs: buildAndTest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo dnf install git java-21-amazon-corretto -y
            
            # 2. Check if the folder exists
            if [ ! -d "group-project" ]; then
              echo "Repository not found. Cloning for the first time..."
              git clone https://github.com/advprog-2026-A5-project/group-project.git
              cd group-project
            else
              echo "Repository exists. Pulling latest changes..."
              cd group-project
              git pull origin main
            fi
            
            cd apps/backend
            chmod +x gradlew
            
            # GitHub already ran the tests in the 'buildAndTest'
            ./gradlew clean bootJar -x test
            
            sudo pkill -f 'java -jar' || true
            nohup java -jar build/libs/*.jar > app.log 2>&1 &
            echo "Deployment successful!"
